name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unzip any archives
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -oq "$z"; fi
          done
      - name: Find Gradle project
        id: find
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then echo "لم يُعثر على settings.gradle في أي مكان"; exit 1; fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Project found in: $d"
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.find.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: MorseSOS-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
